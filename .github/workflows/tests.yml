name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: loudnessgate demo
      - name: Two-pass normalization must actually hit the target
        run: |
          ffmpeg -loglevel error -y -f lavfi -i "sine=frequency=220:duration=12,volume=-26dB" -ac 2 -ar 48000 /tmp/quiet.wav
          loudnessgate normalize /tmp/quiet.wav /tmp/loud.wav --profile podcast > /tmp/norm.json
          python -c "import json; d=json.load(open('/tmp/norm.json')); a=d['after']; assert a['passed'], a; print('after:', a['checks'][0])"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t loudnessgate:ci .
      - name: Smoke-test the workbench and the API boundary
        run: |
          docker run -d --name lg -p 8090:8090 loudnessgate:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8090/ >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8090/ | grep -qi '<html'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8090/api/analyze -d '{"path":"/etc/hosts"}')
          test "$code" = "400"
